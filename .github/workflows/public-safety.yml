name: Public safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies and test runner
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements-minimal.txt

      - name: Run no-credential context recovery demo
        run: python examples/context_recovery_demo.py

      - name: Verify direct upload defaults to dry-run
        run: python actions/upload_to_youtube.py

      - name: Run public safety tests
        run: python -m pytest tests/test_shion_public_safety.py -q
